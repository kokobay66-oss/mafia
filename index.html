<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مجلس المافيا</title>
<style>
:root{--bg:#0f0d1a;--card:#1c1930;--tx:#f3f0ff;--mu:#9d97bd;--ac:#e0475b;--ac2:#ff7a59;--bd:#2f2b4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,#2a1f4a,var(--bg) 60%) fixed;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.logo{font-weight:800;font-size:17px}
.pc{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:40px;padding:6px 8px 6px 16px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--bd)}
.av.big{width:96px;height:96px}
.pn{font-weight:700;font-size:14px}.pi{font-size:11px;color:var(--mu)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px}
.h{text-align:center;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin:10px 0}
.c{text-align:center}
p{color:var(--mu);margin:6px 0;line-height:1.7}
.l{text-align:right;font-size:13px;margin:10px 0 2px}
button,input{font:inherit;width:100%;padding:14px;border-radius:14px;border:1px solid var(--bd);margin:6px 0}
input{background:var(--bg);color:var(--tx);text-align:center}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;font-weight:800;font-size:18px;cursor:pointer;padding:18px}
.btn.alt{background:var(--card);border:1px solid var(--ac);color:var(--tx)}
.btn.ghost{background:transparent;border:1px dashed var(--bd);color:var(--mu);font-size:15px;padding:14px}
.btn:disabled{opacity:.4}
.sep{height:14px}
.err{color:var(--ac);text-align:center;min-height:22px;font-size:14px}
.avw{position:relative;display:inline-block;cursor:pointer}
.cam{position:absolute;bottom:0;left:0;background:var(--ac);border-radius:50%;width:30px;height:30px;line-height:30px;font-size:15px}
nav{display:flex;gap:14px;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
nav button{flex:1;margin:0;padding:10px 4px;background:var(--card);color:var(--mu);font-size:12px;border-radius:16px}
nav button span{display:block;font-size:22px}
nav button.on{color:#fff;border-color:var(--ac)}
.code{font-size:44px;letter-spacing:8px;font-weight:800;direction:ltr}
.pl{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--bd)}
.pl .av{width:36px;height:36px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#000c;padding:10px 18px;border-radius:20px;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,deleteDoc,updateDoc,collection,getDocs,onSnapshot,query,orderBy,where,limit,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyC0raHI8DivZ0e5QNIM9EgYf4JeO3m3pc8",
  authDomain:"mafia-majlis.firebaseapp.com",
  projectId:"mafia-majlis",
  storageBucket:"mafia-majlis.firebasestorage.app",
  messagingSenderId:"471485943029",
  appId:"1:471485943029:web:fc182eab8df6ee3d7209bc"
});
const auth=getAuth(app),db=getFirestore(app);
const $=i=>document.getElementById(i),A=$('app');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MIN=3,MAX=12; // للتجربة MIN=3، لاحقًا 5
const R={mafia:['مافيا','🔪'],doctor:['الطبيب','💉'],detective:['المحقق','🕵️'],citizen:['مواطن','🙂']};
let me,prof,code,room,players=[],unsubs=[],tab='play',draft={};
let myRole=null,myRes=null,hostRoles={},actions=[],votes=[],acted='',done='',hostSub=false;
const stop=()=>{unsubs.forEach(f=>f());unsubs=[]};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const age=b=>{const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a};
const readImg=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
const topbar=()=>'<div class="top"><div class="pc"><img class="av" src="'+esc(prof.photo)+'"><div><div class="pn">'+esc(prof.name)+'</div><div class="pi">ID: '+prof.pid+'</div></div></div><div class="logo">🎭 مجلس المافيا</div></div>';
const nm=u=>(players.find(p=>p.id===u)||{}).name||'لاعب';

function login(msg){
  stop();
  A.innerHTML='<main><h1 class="h">🎭 مجلس المافيا</h1><div class="card c"><p>سجّل دخولك عشان تلعب</p></div><button class="btn" id="g">الدخول عن طريق قوقل</button><div class="err" id="e">'+esc(msg)+'</div></main>';
  $('g').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){login('ما انفتح الدخول: '+e.code)}};
}

function formHTML(edit){
  return '<div class="card c"><label class="avw"><img id="pv" class="av big" src="'+esc(draft.photo)+'"><span class="cam">📷</span><input type="file" id="pf" accept="image/*" hidden></label>'+
  '<input id="nm" maxlength="14" placeholder="اسمك في اللعبة" value="'+esc(draft.name)+'">'+
  '<p class="l">تاريخ الميلاد</p><input id="bd" type="date" value="'+esc(draft.birth)+'">'+
  '<div class="err" id="e"></div><button class="btn" id="sv">'+(edit?'حفظ التعديلات':'إنشاء الحساب')+'</button></div>';
}
function bindForm(edit){
  $('pf').onchange=async e=>{const f=e.target.files[0];if(f){draft.photo=await readImg(f);$('pv').src=draft.photo}};
  $('nm').oninput=e=>draft.name=e.target.value;
  $('bd').onchange=e=>draft.birth=e.target.value;
  $('sv').onclick=()=>saveProfile(edit);
}
async function saveProfile(edit){
  const n=draft.name.trim(),e=m=>$('e').textContent=m;
  if(n.length<2){e('الاسم قصير');return}
  if(!draft.birth){e('اختر تاريخ ميلادك');return}
  const a=age(draft.birth);
  if(!(a>=13&&a<=100)){e(a<13?'اللعبة للعمر 13 سنة وفوق':'تاريخ غير صحيح');return}
  try{
    if(edit){
      prof={...prof,name:n,photo:draft.photo,birth:draft.birth};
      await updateDoc(doc(db,'users',me.uid),{name:n,photo:draft.photo,birth:draft.birth});
      toast('انحفظ ✅');shell();
    }else{
      let pid;do{pid=String(Math.floor(100000+Math.random()*900000))}while((await getDoc(doc(db,'ids',pid))).exists());
      await setDoc(doc(db,'ids',pid),{uid:me.uid});
      prof={name:n,photo:draft.photo,birth:draft.birth,pid};
      await setDoc(doc(db,'users',me.uid),{...prof,createdAt:serverTimestamp()});
      shell();
    }
  }catch(x){e('مشكلة: '+x.code)}
}
function setup(){
  A.innerHTML='<div class="top"><div class="logo">🎭 مجلس المافيا</div></div><main><h2 class="h">أنشئ حسابك</h2>'+formHTML(false)+'</main>';
  bindForm(false);
}

function shell(msg){
  stop();code=null;room=null;
  let b='';
  if(tab==='play')b='<button class="btn" id="rnd">🎲 عشوائي</button><button class="btn alt" id="cus">🛠️ مخصص</button><div class="sep"></div><button class="btn ghost" id="off">🪑 أوف لاين (قعدة)</button>';
  else if(tab==='msg')b='<div class="card c"><div style="font-size:48px">💬</div><p>الرسائل والأصدقاء قريبًا</p></div>';
  else b='<h2 class="h">أنا</h2>'+formHTML(true)+'<button class="btn alt" id="lo" style="font-size:15px;padding:12px">تسجيل خروج</button>';
  const tabs=[['play','🎮','اللعب'],['msg','💬','الرسائل'],['me','👤','أنا']];
  A.innerHTML=topbar()+'<main>'+b+'<div class="err" id="e">'+esc(msg||'')+'</div></main><nav>'+
    tabs.map(t=>'<button data-t="'+t[0]+'" class="'+(tab===t[0]?'on':'')+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join('')+'</nav>';
  document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>{tab=x.dataset.t;if(tab==='me')draft={...prof};shell()});
  if(tab==='play'){$('rnd').onclick=quick;$('cus').onclick=()=>custom();$('off').onclick=()=>toast('الأوف لاين قريبًا')}
  if(tab==='me'){bindForm(true);$('lo').onclick=()=>signOut(auth)}
}

function custom(msg){
  A.innerHTML=topbar()+'<main><div class="card c"><button class="btn" id="c">إنشاء غرفة جديدة</button></div>'+
  '<div class="card c"><input id="cd" maxlength="4" inputmode="numeric" placeholder="كود الغرفة"><button class="btn alt" id="j" style="font-size:16px;padding:14px">انضم</button></div>'+
  '<div class="err" id="e">'+esc(msg||'')+'</div><button class="btn ghost" id="bk">رجوع</button></main>';
  $('c').onclick=async()=>{try{await newRoom(false)}catch(x){custom('مشكلة: '+x.code)}};
  $('j').onclick=()=>joinRoom($('cd').value.trim());
  $('bk').onclick=()=>shell();
}

const addMe=c=>setDoc(doc(db,'rooms',c,'players',me.uid),{name:prof.name,photo:prof.photo,joinedAt:serverTimestamp()});
async function newRoom(pub){
  let c;do{c=String(Math.floor(1000+Math.random()*9000))}while((await getDoc(doc(db,'rooms',c))).exists());
  await setDoc(doc(db,'rooms',c),{host:me.uid,status:'lobby',public:pub,createdAt:serverTimestamp()});
  await addMe(c);enter(c);
}
async function joinRoom(c){
  if(c.length!==4){custom('الكود 4 أرقام');return}
  try{
    const s=await getDoc(doc(db,'rooms',c));
    if(!s.exists()){custom('ما لقيت الغرفة');return}
    if(s.data().status!=='lobby'){custom('اللعبة بدأت');return}
    if((await getDocs(collection(db,'rooms',c,'players'))).size>=MAX){custom('الغرفة ممتلئة');return}
    await addMe(c);enter(c);
  }catch(x){custom('مشكلة: '+x.code)}
}
async function quick(){
  $('e').textContent='ندوّر لك على غرفة...';
  try{
    const q=await getDocs(query(collection(db,'rooms'),where('public','==',true),where('status','==','lobby'),limit(10)));
    for(const d of q.docs){
      const t=d.data().createdAt;
      if(t&&Date.now()-t.toMillis()>20*60000)continue;
      const n=(await getDocs(collection(db,'rooms',d.id,'players'))).size;
      if(n>0&&n<MAX){await addMe(d.id);enter(d.id);return}
    }
    await newRoom(true);
  }catch(x){shell('مشكلة: '+x.code)}
}

function enter(c){
  stop();code=c;myRole=null;myRes=null;hostRoles={};actions=[];votes=[];acted='';done='';hostSub=false;
  unsubs.push(onSnapshot(doc(db,'rooms',c),s=>{
    if(!s.exists()){shell('المضيف سكّر الغرفة');return}
    room=s.data();
    if(room.host===me.uid&&!hostSub){hostSub=true;hostListen(c)}
    render();hostCheck();
  }));
  unsubs.push(onSnapshot(query(collection(db,'rooms',c,'players'),orderBy('joinedAt')),s=>{
    players=s.docs.map(d=>({id:d.id,...d.data()}));render();
  }));
  unsubs.push(onSnapshot(doc(db,'rooms',c,'roles',me.uid),s=>{myRole=s.exists()?s.data():null;render()}));
  unsubs.push(onSnapshot(doc(db,'rooms',c,'results',me.uid),s=>{myRes=s.exists()?s.data():null;render()}));
}
function hostListen(c){
  unsubs.push(onSnapshot(collection(db,'rooms',c,'roles'),s=>{hostRoles={};s.docs.forEach(d=>hostRoles[d.id]=d.data().role);hostCheck()}));
  unsubs.push(onSnapshot(collection(db,'rooms',c,'actions'),s=>{actions=s.docs.map(d=>({id:d.id,...d.data()}));hostCheck()}));
  unsubs.push(onSnapshot(collection(db,'rooms',c,'votes'),s=>{votes=s.docs.map(d=>({id:d.id,...d.data()}));hostCheck()}));
}

function render(){
  if(!room||!code)return;
  if(room.status==='playing'){gameRender();return}
  const host=room.host===me.uid;
  A.innerHTML=topbar()+'<main><div class="card c"><p>'+(room.public?'غرفة عشوائية':'كود الغرفة')+'</p><div class="code">'+code+'</div></div>'+
  '<div class="card"><p style="text-align:center">اللاعبين ('+players.length+')</p>'+
  players.map(p=>'<div class="pl"><img class="av" src="'+esc(p.photo)+'"><span>'+esc(p.name)+(p.id===room.host?' 👑':'')+'</span></div>').join('')+'</div>'+
  (host?'<button class="btn" id="s" '+(players.length<MIN?'disabled':'')+'>ابدأ اللعبة'+(players.length<MIN?' (يحتاج '+MIN+')':'')+'</button>':'<p style="text-align:center">ننتظر المضيف يبدأ...</p>')+
  '<button class="btn ghost" id="l">خروج من الغرفة</button></main>';
  if(host)$('s').onclick=startGame;
  $('l').onclick=leave;
}
async function leave(){
  const c=code,host=room&&room.host===me.uid;
  stop();
  try{await deleteDoc(doc(db,'rooms',c,'players',me.uid));if(host)await deleteDoc(doc(db,'rooms',c))}catch(e){}
  shell();
}

/* ===== منطق اللعبة ===== */
async function startGame(){
  try{
    const ids=players.map(p=>p.id),n=ids.length,m=Math.max(1,Math.floor(n/4)),r=n-m;
    const roles=Array(m).fill('mafia');
    if(r>=2)roles.push('doctor');
    if(r>=3)roles.push('detective');
    while(roles.length<n)roles.push('citizen');
    roles.sort(()=>Math.random()-.5);
    const mafia=ids.filter((u,i)=>roles[i]==='mafia');
    await Promise.all(ids.map((u,i)=>setDoc(doc(db,'rooms',code,'roles',u),{role:roles[i],team:roles[i]==='mafia'?mafia:[]})));
    await updateDoc(doc(db,'rooms',code),{status:'playing',phase:'reveal',round:1,alive:ids,lastDeath:null,voteOut:null,winner:null,finalRoles:null});
  }catch(e){toast('مشكلة: '+e.code)}
}
const pick=a=>{const c={};a.forEach(t=>c[t]=(c[t]||0)+1);const mx=Math.max(...Object.values(c));const top=Object.keys(c).filter(k=>c[k]===mx);return top[Math.floor(Math.random()*top.length)]};
function winner(alive){
  const m=alive.filter(u=>hostRoles[u]==='mafia').length,c=alive.length-m;
  return m===0?'citizens':(m>=c?'mafia':null);
}
async function hostCheck(){
  if(!room||room.host!==me.uid||room.status!=='playing')return;
  const key=room.phase+':'+room.round;
  if(done===key)return;
  try{
    if(room.phase==='night'){
      const need=room.alive.filter(u=>['mafia','doctor','detective'].includes(hostRoles[u]));
      const acts=actions.filter(a=>a.round===room.round);
      if(need.length&&need.every(u=>acts.some(a=>a.id===u))){done=key;await resolveNight(acts)}
    }else if(room.phase==='vote'){
      const vs=votes.filter(v=>v.round===room.round);
      if(room.alive.every(u=>vs.some(v=>v.id===u))){done=key;await resolveVote(vs)}
    }
  }catch(e){done='';toast('مشكلة: '+e.code)}
}
async function resolveNight(acts){
  const by=r=>acts.filter(a=>hostRoles[a.id]===r);
  const mk=by('mafia').map(a=>a.target);
  const kill=mk.length?pick(mk):null;
  const save=(by('doctor')[0]||{}).target;
  const det=by('detective')[0];
  const dead=kill&&kill!==save?kill:null;
  const alive=room.alive.filter(u=>u!==dead);
  if(det)await setDoc(doc(db,'rooms',code,'results',det.id),{round:room.round,target:det.target,mafia:hostRoles[det.target]==='mafia'});
  const w=winner(alive);
  await updateDoc(doc(db,'rooms',code),{alive,phase:w?'end':'day',lastDeath:dead?{uid:dead,role:hostRoles[dead]}:null,winner:w,finalRoles:w?hostRoles:null});
}
async function resolveVote(vs){
  const t=vs.map(v=>v.target).filter(x=>x!=='skip');
  let out=null;
  if(t.length){
    const c={};t.forEach(x=>c[x]=(c[x]||0)+1);
    const mx=Math.max(...Object.values(c)),top=Object.keys(c).filter(k=>c[k]===mx);
    if(top.length===1)out=top[0];
  }
  const alive=room.alive.filter(u=>u!==out);
  const w=winner(alive);
  await updateDoc(doc(db,'rooms',code),{alive,phase:w?'end':'result',voteOut:out?{uid:out,role:hostRoles[out]}:null,winner:w,finalRoles:w?hostRoles:null});
}
async function act(t){
  const night=room.phase==='night';
  try{
    await setDoc(doc(db,'rooms',code,night?'actions':'votes',me.uid),{round:room.round,target:t});
    acted=(night?'n':'v')+room.round;gameRender();
  }catch(e){toast('مشكلة: '+e.code)}
}
const listBtns=(ids,skip)=>ids.map(u=>'<button class="btn alt" data-p="'+u+'" style="font-size:16px;padding:14px">'+esc(nm(u))+'</button>').join('')+(skip?'<button class="btn ghost" data-p="skip">امتناع</button>':'');

function gameRender(){
  const host=room.host===me.uid,alive=room.alive.includes(me.uid),ph=room.phase,r=room.round;
  const role=myRole?myRole.role:null,rl=role?R[role]:['...','⏳'];
  const aliveList='<div class="card c"><p>الأحياء ('+room.alive.length+')</p><span>'+room.alive.map(u=>esc(nm(u))).join(' · ')+'</span></div>';
  const wait='<p style="text-align:center">ننتظر المضيف...</p>';
  const nx={reveal:{phase:'night'},day:{phase:'vote'},result:{phase:'night',round:r+1}}[ph];
  const hb=label=>host?'<button class="btn" id="adv">'+label+'</button>':wait;
  const ghost='<div class="card c"><div style="font-size:48px">👻</div><p>أنت خارج اللعبة، تابع بصمت</p></div>';
  const ok='<div class="card c"><p>تم ✅ ننتظر الباقين...</p></div>';
  let b='';
  if(ph==='reveal'){
    const mates=role==='mafia'?myRole.team.filter(u=>u!==me.uid):[];
    b='<div class="card c"><p>دورك</p><div style="font-size:64px">'+rl[1]+'</div><h2>'+rl[0]+'</h2>'+(mates.length?'<p>شركاؤك: '+mates.map(u=>esc(nm(u))).join('، ')+'</p>':'')+'</div>'+hb('ابدأ الليل');
  }else if(ph==='night'){
    if(!alive)b=ghost;
    else if(acted==='n'+r)b=ok;
    else if(role==='mafia')b='<div class="card c"><p>🔪 من تبون تقتلون؟</p></div>'+listBtns(room.alive.filter(u=>!myRole.team.includes(u)));
    else if(role==='doctor')b='<div class="card c"><p>💉 من تحمي هالليلة؟</p></div>'+listBtns(room.alive);
    else if(role==='detective')b='<div class="card c"><p>🕵️ من تشك فيه؟</p></div>'+listBtns(room.alive.filter(u=>u!==me.uid));
    else b='<div class="card c"><div style="font-size:48px">🌙</div><p>الليل... الكل يغمض عينه</p></div>';
  }else if(ph==='day'){
    const d=room.lastDeath;
    b='<div class="card c"><div style="font-size:48px">☀️</div><p style="color:var(--tx)">'+(d?'💀 قُتل <b>'+esc(nm(d.uid))+'</b> وكان '+R[d.role][0]:'🌅 مرّت الليلة بدون قتلى')+'</p></div>';
    if(role==='detective'&&myRes&&myRes.round===r)b+='<div class="card c"><p>🕵️ نتيجة التحقيق: <b style="color:var(--tx)">'+esc(nm(myRes.target))+'</b>'+(myRes.mafia?' مافيا 🔪':' بريء 🙂')+'</p></div>';
    b+=aliveList+hb('انتقل للتصويت');
  }else if(ph==='vote'){
    if(!alive)b=ghost;
    else if(acted==='v'+r)b=ok;
    else b='<div class="card c"><p>🗳️ من تبي تطرده؟</p></div>'+listBtns(room.alive.filter(u=>u!==me.uid),true);
  }else if(ph==='result'){
    const o=room.voteOut;
    b='<div class="card c"><div style="font-size:48px">⚖️</div><p style="color:var(--tx)">'+(o?'تم إقصاء <b>'+esc(nm(o.uid))+'</b> وكان '+R[o.role][0]:'تعادل، ما أحد انطرد')+'</p></div>'+aliveList+hb('ابدأ الليل');
  }else if(ph==='end'){
    const f=room.finalRoles||{},mw=room.winner==='mafia';
    b='<div class="card c"><div style="font-size:56px">'+(mw?'🔪':'🎉')+'</div><h2>'+(mw?'فازت المافيا':'فاز المواطنون')+'</h2></div><div class="card">'+
      Object.keys(f).map(u=>'<div class="pl"><span>'+R[f[u]][1]+' '+esc(nm(u))+' · '+R[f[u]][0]+(room.alive.includes(u)?'':' 💀')+'</span></div>').join('')+'</div>';
  }
  const mine=(ph==='reveal'||ph==='end')?'':'<p style="text-align:center">دورك: '+rl[1]+' '+rl[0]+'</p>';
  A.innerHTML=topbar()+'<main>'+mine+b+'<button class="btn ghost" id="l">خروج</button></main>';
  document.querySelectorAll('[data-p]').forEach(x=>x.onclick=()=>act(x.dataset.p));
  if(host&&nx&&$('adv'))$('adv').onclick=()=>updateDoc(doc(db,'rooms',code),nx);
  $('l').onclick=leave;
}

onAuthStateChanged(auth,async u=>{
  me=u;
  if(!u){login('');return}
  try{
    const s=await getDoc(doc(db,'users',u.uid));
    if(s.exists()){prof=s.data();shell()}
    else{draft={name:u.displayName||'',photo:u.photoURL||'',birth:''};setup()}
  }catch(x){login('مشكلة: '+x.code)}
});
</script>
