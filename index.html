<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجلس المافيا</title>
<style>
:root{--bg:#14121f;--card:#221f33;--tx:#f3f0ff;--mu:#a59fc4;--ac:#e0475b;--bd:#37334d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:40px 16px}
h1{text-align:center;font-size:28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin:14px 0;text-align:center}
p{color:var(--mu);line-height:1.7}
button{font:inherit;width:100%;padding:14px;border-radius:12px;border:0;background:var(--ac);color:#fff;font-weight:700;cursor:pointer;margin:6px 0}
button.alt{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
img{width:72px;height:72px;border-radius:50%}
.big{font-size:56px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const app=initializeApp({
  apiKey:"AIzaSyC0raHI8DivZ0e5QNIM9EgYf4JeO3m3pc8",
  authDomain:"mafia-majlis.firebaseapp.com",
  projectId:"mafia-majlis",
  storageBucket:"mafia-majlis.firebasestorage.app",
  messagingSenderId:"471485943029",
  appId:"1:471485943029:web:fc182eab8df6ee3d7209bc"
});
const auth=getAuth(app);
const A=document.getElementById('app');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function loginScreen(msg){
  A.innerHTML='<h1>🎭 مجلس المافيا</h1><div class="card"><div class="big">🔐</div><p>سجّل دخولك عشان تلعب</p></div>'+
  '<button id="g">الدخول عن طريق قوقل</button><p id="e" style="color:var(--ac);text-align:center">'+esc(msg)+'</p>';
  document.getElementById('g').onclick=async()=>{
    try{await signInWithPopup(auth,new GoogleAuthProvider())}
    catch(e){loginScreen('ما انفتح الدخول: '+e.code)}
  };
}
function home(u){
  A.innerHTML='<h1>🎭 مجلس المافيا</h1><div class="card">'+(u.photoURL?'<img src="'+esc(u.photoURL)+'" alt="">':'')+
  '<h2>أهلاً '+esc(u.displayName)+'</h2><p>تم تسجيل دخولك بنجاح ✅</p></div>'+
  '<button class="alt" id="o">تسجيل خروج</button><p style="text-align:center">الخطوة الجاية: الغرف واللوبي</p>';
  document.getElementById('o').onclick=()=>signOut(auth);
}
onAuthStateChanged(auth,u=>u?home(u):loginScreen(''));
</script>
</body>
</html>
