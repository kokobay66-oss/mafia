<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="google" content="notranslate">
<title>مجلس المافيا</title>
<style>body{background:#0f0d1a;margin:0}</style>
<script>var l=document.createElement('link');l.rel='stylesheet';l.href='style.css?'+Date.now();document.head.appendChild(l)</script>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyC0raHI8DivZ0e5QNIM9EgYf4JeO3m3pc8",
  authDomain:"mafia-majlis.firebaseapp.com",
  projectId:"mafia-majlis",
  storageBucket:"mafia-majlis.firebasestorage.app",
  messagingSenderId:"471485943029",
  appId:"1:471485943029:web:fc182eab8df6ee3d7209bc"
});
const auth=getAuth(app),db=getFirestore(app);
const SOC=import('./social.js?'+Date.now()).catch(e=>{console.error(e);return null});
const ROO=import('./rooms.js?'+Date.now()).catch(e=>{console.error(e);return null});
const $=i=>document.getElementById(i),A=$('app');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const GSVG='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
let me,prof,unsubs=[],tab='play',draft={},Social=null,Rooms=null,inited=false;
const stop=()=>{unsubs.forEach(f=>f());unsubs=[];if(Social)Social.stopChat();if(Rooms)Rooms.stopRoom()};
const th=l=>{document.body.classList.toggle('light',l);A.classList.remove('fix')};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const age=b=>{const [y,m,d]=b.split('-').map(Number),n=new Date();let a=n.getFullYear()-y;if(n<new Date(n.getFullYear(),m-1,d))a--;return a};
const readImg=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=128;const s=Math.min(i.width,i.height);c.getContext('2d').drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,128,128);r(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(f)});
const topbar=()=>'<div class="top"><div class="pc"><img class="av" src="'+esc(prof.photo)+'"><div><div class="pn">'+esc(prof.name)+'</div><div class="pi">ID: '+prof.pid+'</div></div></div><div class="logo">🎭 مجلس المافيا</div></div>';
const hdr=t=>'<div class="mh"><button class="ib" id="bk">➜</button><h1 style="font-size:22px">'+t+'</h1><span style="width:44px"></span></div>';

function login(msg){
  stop();th(false);
  A.innerHTML='<main><h1 class="h">🎭 مجلس المافيا</h1><div class="card c"><p>سجّل دخولك عشان تلعب</p></div><button class="gbtn" id="g">'+GSVG+'<span>الدخول عن طريق قوقل</span></button><div class="err" id="e">'+esc(msg)+'</div></main>';
  $('g').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){login('ما انفتح الدخول: '+e.code)}};
}

/* عجلات تاريخ الميلاد */
const yrs=()=>{const y=new Date().getFullYear(),a=[];for(let i=y-13;i>=y-80;i--)a.push(i);return a};
const wh=(id,arr,t)=>'<div class="wh" id="'+id+'">'+arr.map(v=>'<div>'+t(v)+'</div>').join('')+'</div>';
function wheelsHTML(){
  const D=[...Array(31)].map((_,i)=>i+1),M=[...Array(12)].map((_,i)=>i+1);
  return '<p class="l">تاريخ الميلاد (اسحب فوق وتحت)</p><div class="wheels">'+wh('wd',D,v=>v)+wh('wm',M,v=>MN[v-1])+wh('wy',yrs(),v=>v)+'</div><p id="ag" class="c"></p>';
}
const mark=el=>{const i=Math.round(el.scrollTop/40);[...el.children].forEach((c,k)=>c.classList.toggle('on',k===i))};
function readB(){
  const i=id=>Math.round($(id).scrollTop/40);
  const d=i('wd')+1,m=i('wm')+1,y=yrs()[i('wy')];
  draft.birth=y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  const ok=new Date(y,m-1,d).getMonth()===m-1;
  $('ag').textContent=ok?'عمرك: '+age(draft.birth)+' سنة':'تاريخ غير صحيح';
}
function bindWheels(){
  const cur=(draft.birth||'').split('-').map(Number),Y=yrs();
  const init={wd:(cur[2]||1)-1,wm:(cur[1]||1)-1,wy:Math.max(0,Y.indexOf(cur[0]||new Date().getFullYear()-25))};
  ['wd','wm','wy'].forEach(id=>{
    const el=$(id);el.scrollTop=init[id]*40;mark(el);
    let t;el.onscroll=()=>{clearTimeout(t);t=setTimeout(()=>{mark(el);readB()},80)};
  });
  readB();
}
function formHTML(edit){
  return '<div class="card c"><label class="avw"><img id="pv" class="av big" src="'+esc(draft.photo)+'"><span class="cam">📷</span><input type="file" id="pf" accept="image/*" hidden></label>'+
  '<input id="nm" maxlength="14" placeholder="اسمك في اللعبة" value="'+esc(draft.name)+'">'+wheelsHTML()+
  '<div class="err" id="e"></div><button class="btn" id="sv">'+(edit?'حفظ التعديلات':'إنشاء الحساب')+'</button></div>';
}
function bindForm(edit){
  $('pf').onchange=async e=>{const f=e.target.files[0];if(f){draft.photo=await readImg(f);$('pv').src=draft.photo}};
  $('nm').oninput=e=>draft.name=e.target.value;
  bindWheels();
  $('sv').onclick=()=>saveProfile(edit);
}
const pubProf=()=>setDoc(doc(db,'profiles',me.uid),{name:prof.name,photo:prof.photo,pid:prof.pid});
async function saveProfile(edit){
  const n=draft.name.trim(),e=m=>$('e').textContent=m;
  if(n.length<2){e('الاسم قصير');return}
  const [y,m,d]=draft.birth.split('-').map(Number);
  if(new Date(y,m-1,d).getMonth()!==m-1){e('تاريخ ميلاد غير صحيح');return}
  if(age(draft.birth)<13){e('اللعبة للعمر 13 سنة وفوق');return}
  try{
    if(edit){
      prof={...prof,name:n,photo:draft.photo,birth:draft.birth};
      await updateDoc(doc(db,'users',me.uid),{name:n,photo:draft.photo,birth:draft.birth});
      await pubProf();
      toast('انحفظ ✅');shell();
    }else{
      let pid;do{pid=String(Math.floor(100000+Math.random()*900000))}while((await getDoc(doc(db,'ids',pid))).exists());
      await setDoc(doc(db,'ids',pid),{uid:me.uid});
      prof={name:n,photo:draft.photo,birth:draft.birth,pid};
      await setDoc(doc(db,'users',me.uid),{...prof,createdAt:serverTimestamp()});
      await pubProf();
      if(Social)Social.start();
      shell();
    }
  }catch(x){e('مشكلة: '+x.code)}
}
function setup(){
  th(false);
  A.innerHTML='<div class="top"><div class="logo">🎭 مجلس المافيا</div></div><main><h2 class="h">أنشئ حسابك</h2>'+formHTML(false)+'</main>';
  bindForm(false);
}

/* القوائم الرئيسية */
const navHTML=()=>'<nav>'+[['play','🎮','اللعب'],['msg','💬','الرسائل'],['me','👤','أنا']].map(t=>'<button data-t="'+t[0]+'" data-n="'+(t[0]==='msg'&&Social?Social.badgeN():0)+'" class="'+(tab===t[0]?'on':'')+'"><span>'+t[1]+'</span>'+t[2]+'</button>').join('')+'</nav>';
const bindNav=()=>document.querySelectorAll('nav button').forEach(x=>x.onclick=()=>{tab=x.dataset.t;if(tab==='me')draft={...prof};shell()});
function shell(msg){
  stop();th(tab!=='play');
  if(tab==='msg'){
    if(Social){Social.tabScreen();return}
    A.innerHTML='<main><div class="empty">تعذر تحميل الرسائل<br>حدّث الصفحة وجرب مرة ثانية</div></main>'+navHTML();
    bindNav();return;
  }
  let b='';
  if(tab==='play')b='<div class="two"><button class="mode classic" id="rc">كلاسيكي<small>🎲 عشوائي</small></button><button class="mode mad" id="rm2">جنون المافيا<small>🎲 عشوائي</small></button></div><button class="btn alt" id="cus" style="margin-top:12px">🛠️ مخصص</button><div class="sep"></div><button class="btn ghost" id="off">🪑 أوف لاين (قعدة)</button>';
  else b='<h2 class="h">أنا</h2>'+formHTML(true)+'<button class="btn alt" id="lo" style="font-size:15px;padding:12px">تسجيل خروج</button>';
  A.innerHTML=topbar()+'<main>'+b+'<div class="err" id="e2">'+esc(msg||'')+'</div></main>'+navHTML();
  bindNav();
  if(tab==='play'){
    const R=f=>()=>Rooms?f():toast('تعذر تحميل الغرف، حدّث الصفحة');
    $('rc').onclick=R(()=>Rooms.quick('classic'));
    $('rm2').onclick=R(()=>Rooms.quick('mad'));
    $('cus').onclick=R(()=>Rooms.custom());
    $('off').onclick=()=>toast('الأوف لاين قريبًا');
  }
  else{bindForm(true);$('lo').onclick=()=>signOut(auth)}
}
const ctx={A,esc,toast,th,hdr,topbar,nav:navHTML,bindNav,home:m=>shell(m),get me(){return me},get prof(){return prof}};
onAuthStateChanged(auth,async u=>{
  me=u;
  Social=await SOC;Rooms=await ROO;
  if(!inited){if(Social)Social.init(ctx);if(Rooms)Rooms.init(ctx);inited=true}
  if(!u){if(Social)Social.reset();login('');return}
  try{
    const s=await getDoc(doc(db,'users',u.uid));
    if(s.exists()){prof=s.data();await pubProf();if(Social)Social.start();shell()}
    else{draft={name:u.displayName||'',photo:u.photoURL||'',birth:''};setup()}
  }catch(x){login('مشكلة: '+x.code)}
});
</script>
</body>
</html>
